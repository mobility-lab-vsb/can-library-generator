name: Build desktop packages

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: windows
            extension: exe
          - os: macos-latest
            platform: macOS
            artifact: macos
            extension: dmg
          - os: ubuntu-22.04
            platform: linux
            artifact: linux
            extension: deb
    runs-on: ${{ matrix.os }}
    env:
      APP_VERSION: ${{ inputs.version }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgdk-pixbuf2.0-0 libglib2.0-0 libxkbcommon-x11-0
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Set runtime and package versions
        run: python -m src.canlibrarygenerator.scripts.inject_version "${{ inputs.version }}"
      - name: Create native application
        run: briefcase create ${{ matrix.platform }}
      - name: Build native application
        run: briefcase build ${{ matrix.platform }}
      - name: Package macOS
        if: runner.os == 'macOS'
        run: briefcase package macOS --adhoc-sign
      - name: Package Linux
        if: runner.os == 'Linux'
        run: briefcase package linux
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install -y innosetup
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m src.canlibrarygenerator.scripts.make_installer
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-package
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error
