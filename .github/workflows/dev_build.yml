name: Dev Build and Artifact Upload

on:
  push:
    branches: [dev, 'development/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml
  build:
    needs: checks
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0.dev${{ github.run_number }}
