name: Test CAN Library Generator

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      CFLAGS: '-Wall -Wextra -Werror'
      CXXFLAGS: '-Wall -Wextra -Werror'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          path-type: inherit
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Linux compiler and Qt dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc g++ libegl1 libgl1 libxkbcommon0
      - name: Install test and build dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run regression suite
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
        run: python -m unittest discover -s src/canlibrarygenerator/test -p 'test_*.py' -v
      - name: Compile and execute example libraries
        shell: ${{ matrix.os == 'windows-latest' && 'msys2 {0}' || 'bash' }}
        run: python -m src.canlibrarygenerator.test.test_pipeline
      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python -m src.canlibrarygenerator.scripts.check_wheel
